<!doctype html>
<html>
  <body style="margin:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;border:1px solid #e2e8f0">
            <tr><td>
              <h1 style="font-size:20px;margin:0 0 12px">Sign in to book your lessons</h1>
              <p style="font-size:15px;line-height:1.5;color:#475569;margin:0 0 24px">Tap the button below to sign in. This link expires in one hour and can be used once.</p>
              <!-- token_hash flow works even if the link is opened on a different device than the one that requested it -->
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
                 style="display:inline-block;background:#0284c7;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px">Sign in</a>
              <p style="font-size:13px;color:#94a3b8;margin:24px 0 0">If you didn't request this, you can ignore this email.</p>
            </td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
